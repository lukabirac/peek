<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Peek</title>
    <style>
      :root {
        color-scheme: light dark;
        --bg: #ffffff;
        --ink: #101012;
        --on-ink: #ffffff;
        --dim: #74747c;
        --line: rgba(16, 16, 18, 0.09);
        --spin: rgba(16, 16, 18, 0.55);
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --bg: #141416;
          --ink: #f2f2f4;
          --on-ink: #101012;
          --dim: #8a8a93;
          --line: rgba(255, 255, 255, 0.11);
          --spin: rgba(255, 255, 255, 0.62);
        }
      }

      * { box-sizing: border-box; }
      html, body {
        margin: 0;
        height: 100%;
        overflow: hidden;
        background: var(--bg);
        color: var(--ink);
        font: 400 13px/1.55 -apple-system, BlinkMacSystemFont, "SF Pro Text",
          "Inter", system-ui, sans-serif;
        -webkit-font-smoothing: antialiased;
      }

      iframe {
        display: block;
        width: 100%;
        height: 100%;
        border: 0;
        background: transparent;
        opacity: 0;
        transition: opacity 160ms linear;
      }
      iframe[data-painted="1"] { opacity: 1; }

      /* ── Loading ─────────────────────────────────────────────────────── */
      .loader {
        position: absolute;
        inset: 0;
        display: grid;
        place-items: center;
        opacity: 0;
        transform: scale(0.86);
        transition: opacity 220ms linear, transform 260ms cubic-bezier(0.19, 0.91, 0.28, 1);
        pointer-events: none;
      }
      .loader[data-on="1"] { opacity: 1; transform: none; }
      .spinner {
        width: 26px;
        height: 26px;
        border-radius: 50%;
        background: conic-gradient(
          from 0deg,
          transparent 0deg,
          transparent 26deg,
          color-mix(in oklab, var(--spin) 12%, transparent) 96deg,
          var(--spin) 348deg,
          transparent 360deg
        );
        -webkit-mask: radial-gradient(farthest-side, transparent calc(100% - 2px), #000 calc(100% - 2px));
        mask: radial-gradient(farthest-side, transparent calc(100% - 2px), #000 calc(100% - 2px));
        animation: spin 760ms linear infinite;
      }
      @keyframes spin { to { transform: rotate(360deg); } }
      @media (prefers-reduced-motion: reduce) {
        .loader { transform: none; }
        .spinner { animation-duration: 1.6s; }
      }

      /* ── Messages ────────────────────────────────────────────────────── */
      .note {
        position: absolute;
        inset: 0;
        display: none;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 12px;
        padding: 28px 24px;
        text-align: center;
        background: var(--bg);
      }
      .note[data-on="1"] { display: flex; }
      .note h1 {
        margin: 0;
        font-size: 14px;
        font-weight: 600;
        letter-spacing: -0.012em;
      }
      .note p { margin: 0; color: var(--dim); max-width: 34ch; font-size: 12.5px; }
      .note button {
        appearance: none;
        margin-top: 4px;
        padding: 8px 15px;
        border: 0;
        border-radius: 8px;
        background: var(--ink);
        color: var(--on-ink);
        font: inherit;
        font-size: 12.5px;
        font-weight: 560;
        cursor: pointer;
        transition: opacity 110ms linear, transform 110ms ease-out;
      }
      .note button:hover { opacity: 0.86; }
      .note button:active { transform: scale(0.97); }
    </style>
  </head>
  <body>
    <script src="panel.js"></script>
  </body>
</html>
